    <text x="78" y="237" fill="#eff4e9" font-size="126" font-weight="700" letter-spacing="-8">OSAID<tspan fill="#c3ed88">.</tspan></text>
    <text x="82" y="282" fill="#c3ed88" font-size="17" letter-spacing="4">CREATIVE DEVELOPER</text>
    <text x="82" y="339" fill="#b0b8a9" font-size="17">Interfaces with atmosphere. Tools with purpose.</text>
    <text x="1178" y="374" text-anchor="end" fill="#829076" font-size="11" letter-spacing="2">BUILD / EXPLORE / REPEAT</text>
  </g>
  <g transform="translate(995 213) rotate(-24)" fill="none" stroke="url(#orb)">
