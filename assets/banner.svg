<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Osaid — Creative Developer</title>
  <desc id="desc">Charcoal and lime personal lab banner with a wireframe orbital sculpture. Interfaces with atmosphere. Tools with purpose.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c3ed88" stroke-opacity=".045"/></pattern>
    <radialGradient id="halo"><stop stop-color="#c3ed88" stop-opacity=".13"/><stop offset="1" stop-color="#c3ed88" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7ffab"/><stop offset="1" stop-color="#526441"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="16" fill="#0d100d"/>
  <rect width="1280" height="440" rx="16" fill="url(#grid)"/>
  <circle cx="1000" cy="216" r="260" fill="url(#halo)"/>
  <path d="M48 76V48H76M1204 48H1232V76M48 364V392H76M1204 392H1232V364" fill="none" stroke="#c3ed88" stroke-opacity=".5"/>
